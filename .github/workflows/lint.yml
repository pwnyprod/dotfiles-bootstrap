name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n install.sh
      - run: shellcheck install.sh

  powershell:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse install.ps1
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          $errors | ForEach-Object { Write-Output "$($_.Extent.StartLineNumber): $($_.Message)" }
          if ($errors) { exit 1 }
          Write-Output "install.ps1 parst unter PowerShell $($PSVersionTable.PSVersion)"
      - name: PSScriptAnalyzer
        if: matrix.shell == 'pwsh'
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($results) { exit 1 }
